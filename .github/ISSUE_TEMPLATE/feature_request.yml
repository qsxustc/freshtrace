name: Feature or explanation improvement
description: Suggest a focused way to make caching behavior easier to inspect.
title: "[Idea] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to understand or do?
      description: Describe a concrete workflow or confusing result.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Include an example header or interface change if helpful. Use synthetic values.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources and scope
      description: Link to primary sources for proposed semantics. Explain whether the behavior is generic HTTP caching or specific to a provider.
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
      description: How do you handle this today?
